<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1024 1024"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">AI workflow thumbnail</title>
  <desc id="desc">
    An editorial illustration showing a prompt bubble, a structured spec card, and an AI
    processor connected in one workflow.
  </desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcf8f1" />
      <stop offset="100%" stop-color="#f2eee6" />
    </linearGradient>
    <linearGradient id="glowWarm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb36b" />
      <stop offset="100%" stop-color="#ff7b72" />
    </linearGradient>
    <linearGradient id="glowCool" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#72d2dc" />
      <stop offset="100%" stop-color="#4db7b0" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#151515" flood-opacity="0.14" />
    </filter>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#201f1d" stroke-opacity="0.08" stroke-width="2" />
    </pattern>
    <marker
      id="arrow"
      markerWidth="16"
      markerHeight="16"
      refX="10"
      refY="8"
      orient="auto"
      markerUnits="strokeWidth"
    >
      <path d="M 0 0 L 16 8 L 0 16 z" fill="#1a1a1a" />
    </marker>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)" />
  <rect width="1024" height="1024" fill="url(#grid)" />

  <circle cx="178" cy="170" r="118" fill="url(#glowWarm)" opacity="0.16" />
  <circle cx="864" cy="818" r="132" fill="url(#glowCool)" opacity="0.18" />
  <rect x="746" y="114" width="126" height="126" rx="32" fill="#ffffff" opacity="0.65" />
  <rect x="146" y="700" width="90" height="90" rx="22" fill="#ffffff" opacity="0.65" />

  <g stroke="#1a1a1a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9">
